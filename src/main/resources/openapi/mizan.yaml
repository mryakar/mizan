openapi: 3.0.3
info:
  title: mizan
  description: A double-entry ledger service.
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /accounts:
    post:
      summary: Open an account
      operationId: openAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: The account was opened
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Problem'
  /accounts/{id}:
    get:
      summary: Read an account and its balance
      operationId: showAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: The request was rejected
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    OpenAccountRequest:
      type: object
      required: [ ownerName, currency ]
      properties:
        ownerName:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Account:
      type: object
      required: [ id, ownerName, currency, balance, openedAt ]
      properties:
        id:
          type: string
          format: uuid
        ownerName:
          type: string
        currency:
          type: string
        balance:
          type: string
          description: A decimal amount, rendered with the currency's own number of fraction digits.
        openedAt:
          type: string
      additionalProperties: false
    ProblemDetail:
      type: object
      required: [ type, title, status ]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        field:
          type: string
      additionalProperties: false
